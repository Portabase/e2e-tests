name: portabase-api-e2e
services:
  api-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: api_e2e
      POSTGRES_USER: backup
      POSTGRES_PASSWORD: backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backup -d api_e2e"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    networks: [portabase]
  agent:
    image: ${AGENT_IMAGE:-portabase/agent:latest}
    environment:
      EDGE_KEY: ${EDGE_KEY}
      POLLING: 2
      TZ: UTC
    volumes:
      - ${API_AGENT_CONFIG:?API_AGENT_CONFIG is required}:/config/config.json:ro
    depends_on:
      api-postgres:
        condition: service_healthy
    extra_hosts: ["localhost:host-gateway"]
    networks: [portabase]
networks:
  portabase:
    external: true
