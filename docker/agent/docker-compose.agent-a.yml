name: portabase-agent-a

services:

  app:
    image: ${AGENT_IMAGE:-portabase/agent:latest}
    mem_limit: 256m
    cpus: 0.05
    restart: unless-stopped
    volumes:
      - ./databases.json:/config/config.json
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      LOG: info
      TZ: "UTC"
      POLLING: 5
      EDGE_KEY: "${EDGE_KEY}"
    networks:
      - portabase
    extra_hosts:
      - "localhost:host-gateway"

networks:
  portabase:
    name: portabase
    external: true
